
name: Windows 10 Docker VM Test

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Start Windows 10 VM
        run: |
          docker pull dockurr/windows

          docker run -d \
            --name windows10 \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -p 127.0.0.1:8006:8006 \
            -p 127.0.0.1:3389:3389/tcp \
            -p 127.0.0.1:3389:3389/udp \
            -e VERSION=10 \
            -e RAM_SIZE=8G \
            -e CPU_CORES=2 \
            -v "$PWD/windows:/storage" \
            --stop-timeout 120 \
            dockurr/windows

      - name: Allow Windows to initialize
        run: sleep 300

      - name: Inspect Windows installation
        if: always()
        run: |
          docker ps -a
          docker logs --tail 150 windows10

      - name: Clean up
        if: always()
        run: docker rm -f windows10 || true
        
